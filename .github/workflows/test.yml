name: Validação técnica

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verificar sintaxe Python
        run: python -m compileall -q v1
